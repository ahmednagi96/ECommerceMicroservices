# ست خدمات: 3 واجهات + 3 قواعد SQL Server، كل واحدة بقاعدة بياناتها.
#
# أسماء القواعد وكلمات المرور تُقرأ من ملفات الـ .env كما هي، ومش مكتوبة هنا:
#   src/Services/Basket/.env     DB_PORT=1435
#   src/Services/Catalog/.env    DB_PORT=1436
#   src/Services/Ordering/.env   DB_PORT=1437
#
# من على الجهاز البورت هو DB_PORT عشان SSMS و dotnet run يفضلوا زي الملف.
# جوّه شبكة Docker القاعدة بتسمع على 1433، والـ API بيتصل باسم الخدمة مش localhost.
#
# بورتات الواجهات هي بروفايل http في launchSettings:
#   Catalog   http://localhost:5299/swagger
#   Basket    http://localhost:5260/swagger
#   Ordering  http://localhost:5257/swagger
#
#   docker compose up -d --build
#   docker compose down
#   docker compose down -v

name: ecommerce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# SQL Server بيرفض الإقلاع لو شايف أقل من 2GB، فسقف الحاوية أعلى من كده.
# MSSQL_MEMORY_LIMIT_MB بيحبس الاستهلاك الفعلي عشان التلات قواعد يعيشوا على لابتوب.
x-sqlserver: &sqlserver
  image: mcr.microsoft.com/mssql/server:2022-latest
  platform: linux/amd64
  pull_policy: missing
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  networks:
    - ecommerce
  entrypoint: ["/bin/bash", "-c"]
  command:
    - |
      set -euo pipefail
      if [ -z "$${DB_PASSWORD:-}" ]; then
        echo "DB_PASSWORD is empty. Check the service .env file." >&2
        exit 1
      fi
      export ACCEPT_EULA=Y
      export MSSQL_PID=Developer
      export MSSQL_MEMORY_LIMIT_MB="$${MSSQL_MEMORY_LIMIT_MB:-512}"
      export MSSQL_SA_PASSWORD="$$DB_PASSWORD"
      echo "SQL Server is starting for database $${DB_NAME:-unknown}."
      exec /opt/mssql/bin/sqlservr
  environment:
    MSSQL_MEMORY_LIMIT_MB: "512"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "grep -q 'ready for client connections' /var/opt/mssql/log/errorlog"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 25s
  logging: *default-logging
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 2560m

x-api: &api
  restart: unless-stopped
  init: true
  stop_grace_period: 15s
  networks:
    - ecommerce
  security_opt:
    - no-new-privileges:true
  entrypoint: ["/bin/bash", "-c"]
  command:
    - |
      set -euo pipefail
      echo "Waiting for $$DB_HOST:$$DB_PORT (database $$DB_NAME)..."
      ready=0
      i=0
      while [ "$$i" -lt 30 ]; do
        if (exec 3<>"/dev/tcp/$$DB_HOST/$$DB_PORT") 2>/dev/null; then
          ready=1
          break
        fi
        i=$$((i + 1))
        sleep 2
      done
      if [ "$$ready" -ne 1 ]; then
        echo "Database $$DB_HOST:$$DB_PORT did not accept connections in time." >&2
        exit 1
      fi
      export ConnectionStrings__DefaultConnection="$$(printf 'Server=%s,%s;Database=%s;User Id=%s;Password=%s;TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;' "$$DB_HOST" "$$DB_PORT" "$$DB_NAME" "$$DB_USER" "$$DB_PASSWORD")"
      echo "Starting $$DLL_NAME against $$DB_HOST,$$DB_PORT / $$DB_NAME."
      exec dotnet "$$DLL_NAME"
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    interval: 10s
    timeout: 3s
    retries: 18
    start_period: 20s
  logging: *default-logging
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512m

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  DB_PORT: "1433"

services:
  catalog-db:
    <<: *sqlserver
    container_name: ecommerce-catalog-db
    hostname: catalog-db
    env_file:
      - ./src/Services/Catalog/.env
    ports:
      - "127.0.0.1:1436:1433"
    volumes:
      - catalog-db-data:/var/opt/mssql
    labels:
      com.ecommerce.service: catalog
      com.ecommerce.tier: data

  catalog-api:
    <<: *api
    #container_name: ecommerce-catalog-api
    hostname: catalog-api
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    env_file:
      - ./src/Services/Catalog/.env
    environment:
      <<: *api-env
      DLL_NAME: Catalog.API.dll
      DB_HOST: catalog-db
      RabbitMq__HostName: rabbitmq   # NEW
      ConnectionStrings__Redis: redis:6379 #NEW
    #ports:
    #  - "127.0.0.1:5299:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
        restart: true
      rabbitmq:                       # NEW
          condition: service_healthy    # Wolverine needs RabbitMQ at startup (AutoProvision  
      redis:                                     # NEW
        condition: service_healthy      
    labels:
      com.ecommerce.service: catalog
      com.ecommerce.tier: api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s       # يفحص كل 10 ثواني
      timeout: 3s         # لو مردش في 3 ثواني يبقى فشل
      retries: 5          # 5 مرات فشل ورا بعض = unhealthy
      start_period: 20s   # فترة سماح في الأول عشان الـ Migration    

  basket-db:
    <<: *sqlserver
    container_name: ecommerce-basket-db
    hostname: basket-db
    env_file:
      - ./src/Services/Basket/.env
    ports:
      - "127.0.0.1:1435:1433"
    volumes:
      - basket-db-data:/var/opt/mssql
    labels:
      com.ecommerce.service: basket
      com.ecommerce.tier: data

  basket-api:
    <<: *api
    #container_name: ecommerce-basket-api
    hostname: basket-api
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.API/Dockerfile
    env_file:
      - ./src/Services/Basket/.env
    environment:
      <<: *api-env
      DLL_NAME: Basket.API.dll
      DB_HOST: basket-db
      RabbitMq__HostName: rabbitmq   # اسم خدمة RabbitMQ على شبكة Docker (localhost هنا = الحاوية نفسها)
      Auth__MetadataAddress: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration

    ports:
      - "127.0.0.1:5260:8080"
    depends_on:
      basket-db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy   # Wolverine needs RabbitMQ at startup (AutoProvision)
    labels:
      com.ecommerce.service: basket
      com.ecommerce.tier: api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s  

  ordering-db:
    <<: *sqlserver
    container_name: ecommerce-ordering-db
    hostname: ordering-db
    env_file:
      - ./src/Services/Ordering/.env
    ports:
      - "127.0.0.1:1437:1433"
    volumes:
      - ordering-db-data:/var/opt/mssql
    labels:
      com.ecommerce.service: ordering
      com.ecommerce.tier: data

  ordering-api:
    <<: *api
    #container_name: ecommerce-ordering-api
    hostname: ordering-api
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
    env_file:
      - ./src/Services/Ordering/.env
    environment:
      <<: *api-env
      DLL_NAME: Ordering.API.dll
      DB_HOST: ordering-db
      RabbitMq__HostName: rabbitmq        # 👈 اسم خدمة RabbitMQ في الـ compose
      Auth__MetadataAddress: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5257-5259:8080"
    depends_on:
      ordering-db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy   # Wolverine needs RabbitMQ at startup (AutoProvision)
    labels:
      com.ecommerce.service: ordering
      com.ecommerce.tier: api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s  

  rabbitmq:
    image: rabbitmq:4-management      # management = فيه لوحة تحكم
    container_name: rabbitmq
    env_file:
      - ./rabbitmq.env
    #ports:
    #  - "5672:5672"     # البورت اللي الخدمات بتكلمه (AMQP)
    #  - "15672:15672"   # لوحة التحكم في المتصفح
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # الرسائل متضيعش لو الكونتينر اتقفل
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce
  redis:
    image: redis:8-alpine
    container_name: ecommerce-redis
    hostname: redis
    # Cache only: no disk persistence, max 256MB, drop least-used keys when full
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    #ports:
    #  - "127.0.0.1:6379:6379"
    networks:
      - ecommerce
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gateway-api:
    container_name: ecommerce-gateway-api
    hostname: gateway-api
    build:
      context: .
      dockerfile: src/ApiGateways/Gateway.API/Dockerfile
    restart: unless-stopped
    init: true
    networks:
      - ecommerce
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      # Override localhost addresses with Docker service names
      #ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-1__Address: http://catalog-api:8080/
      #ReverseProxy__Clusters__basket-cluster__Destinations__basket-1__Address: http://basket-api:8080/
      #ReverseProxy__Clusters__ordering-cluster__Destinations__ordering-1__Address: http://ordering-api:8080/
    ports:
      - "127.0.0.1:5100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    labels:
      com.ecommerce.service: gateway
      com.ecommerce.tier: edge

  web-bff:
    container_name: ecommerce-web-bff
    hostname: web-bff
    build:
      context: .
      dockerfile: src/ApiGateways/Web.Bff/Dockerfile
    restart: unless-stopped
    init: true
    networks:
      - ecommerce
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    labels:
      com.ecommerce.service: web-bff
      com.ecommerce.tier: edge

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    networks:
      - ecommerce
    env_file:
      - ./keycloak.env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

networks:
  ecommerce:
    name: ecommerce
    driver: bridge

volumes:
  catalog-db-data:
    name: ecommerce-catalog-db
  basket-db-data:
    name: ecommerce-basket-db
  ordering-db-data:
    name: ecommerce-ordering-db
  rabbitmq_data:
    name: ecommerce-rabbitmq
  keycloak-data:
    name: keycloak-data  